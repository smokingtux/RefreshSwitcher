name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      CSC: C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe
    steps:
      - uses: actions/checkout@v4

      # Use the source files in the repo root if they are there, otherwise unpack the source zip.
      - name: Prepare source
        run: |
          if (Test-Path RefreshSwitcher.cs) {
            New-Item -ItemType Directory -Force build/RefreshSwitcher | Out-Null
            Copy-Item RefreshSwitcher.cs, Tests.cs, app.ico build/RefreshSwitcher
          } else {
            Expand-Archive -Path RefreshSwitcher-*-source.zip -DestinationPath build
          }

      - name: Build app
        working-directory: build/RefreshSwitcher
        run: |
          & $env:CSC /nologo /target:winexe /optimize /win32icon:app.ico /out:RefreshSwitcher.exe RefreshSwitcher.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build tests
        working-directory: build/RefreshSwitcher
        run: |
          & $env:CSC /nologo /main:RefreshSwitcher.Tests /out:Tests.exe RefreshSwitcher.cs Tests.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Tests.exe exits with 1 if any check failed.
      - name: Run tests
        working-directory: build/RefreshSwitcher
        run: |
          ./Tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: RefreshSwitcher
          path: build/RefreshSwitcher/RefreshSwitcher.exe
